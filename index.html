
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>တစ်ခုလောက်ရွေးပေးပါနော် 💕</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #ffeef5, #ffd1dc);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .card {
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 30px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(160, 50, 90, 0.25);
            position: relative;
            overflow: hidden;
        }

        .top-heart {
            font-size: 55px;
            animation: floating 2s ease-in-out infinite;
        }

        h1 {
            color: #d6336c;
            font-size: 32px;
            margin: 10px 0;
        }

        .subtitle {
            color: #777;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .display {
            height: 220px;
            border-radius: 25px;
            background: linear-gradient(135deg, #fff0f6, #ffe0eb);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            overflow: hidden;
            position: relative;
        }

        .display-emoji {
            font-size: 100px;
            transition: all 0.5s ease;
        }

        .display-text {
            position: absolute;
            bottom: 18px;
            left: 0;
            right: 0;
            color: #c2255c;
            font-weight: bold;
            font-size: 16px;
        }

        .buttons {
            min-height: 180px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        button {
            border: none;
            padding: 10px 16px;
            min-height: 42px;
            border-radius: 50px;
            background: white;
            color: #555;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);

            transition:
                transform 0.7s ease,
                box-shadow 0.3s ease,
                background 0.3s ease,
                left 0.7s ease,
                top 0.7s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.16);
        }

        .correct {
            background: #ff4f81;
            color: white;
            z-index: 50;
            position: relative;
        }

        .message {
            margin-top: 25px;
            min-height: 30px;
            color: #c2255c;
            font-weight: bold;
            font-size: 18px;
        }

        .counter {
            margin-top: 10px;
            color: #999;
            font-size: 14px;
        }

        .success {
            display: none;
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #ff5c8a, #ff9fba);
            color: white;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            padding: 30px;
        }

        .success.show {
            display: flex;
            animation: fadeIn 0.8s ease;
        }

        .success-heart {
            font-size: 110px;
            animation: heartbeat 1s infinite;
        }

        .success h2 {
            font-size: 38px;
            margin: 15px 0;
        }

        .success p {
            font-size: 20px;
            line-height: 1.6;
            max-width: 500px;
        }

        .photo {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 25px;
            margin: 20px 0;
            display: none;
            border: 5px solid white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .heart {
            position: fixed;
            pointer-events: none;
            animation: rise 4s linear forwards;
            font-size: 25px;
            z-index: 200;
        }

        @keyframes floating {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.2);
            }

            50% {
                transform: scale(1);
            }

            75% {
                transform: scale(1.15);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes pop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            70% {
                transform: scale(1.15);
                opacity: 1;
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes rise {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateY(-100vh) rotate(360deg) scale(1.5);
                opacity: 0;
            }
        }

        .pop {
            animation: pop 0.5s ease;
        }

        @media (max-width: 500px) {

            .card {
                padding: 25px 15px;
                border-radius: 25px;
            }

            h1 {
                font-size: 26px;
            }

            .display {
                height: 180px;
            }

            .display-emoji {
                font-size: 75px;
            }

            button {
                font-size: 12px;
                padding: 9px 13px;
                min-height: 38px;
            }

            .success h2 {
                font-size: 30px;
            }

            .success p {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="top-heart">💗</div>

        <h1>သူငယ်ချင်းအဖြစ်နဲ့ပဲ ဆက်နေချင်သေးလား?</h1>

        <p class="subtitle" id="subtitle">
            သေချာလေးစဉ်းစားပြီးရွေးနော် 🥺
        </p>

        <div class="display">

            <div class="display-emoji" id="displayEmoji">
                🌷
            </div>

            <div class="display-text" id="displayText">
                Pokiရဲ့အဖြေကိုကြားချင်တယ်
            </div>

        </div>

        <div class="buttons">

            <button class="wrong">
                💔 ကောင်မလေး မဖြစ်ချင်ဘူး
            </button>

            <button class="wrong">
                🎁 စဉ်းစားနေတုန်း
            </button>

            <button class="correct" id="correctButton">
                💖 ကောင်မလေးဖြစ်ပေးမယ်
            </button>

            <button class="wrong">
                🌸 သူငယ်ချင်းအဖြစ်ပဲ နေချင်တယ်
            </button>

            <button class="wrong">
                💔ကိုကိုကြီးကို မကြိုက်ဘူး
            </button>

        </div>

        <div class="message" id="message"></div>

        <div class="counter" id="counter">
            Wrong choices: 0
        </div>

        <div class="success" id="success">

            <div class="success-heart">
                💖
            </div>

            <h2>You Found It!</h2>

            <img
                id="myPhoto"
                class="photo"
                src="my-photo.jpg"
                alt="A special photo"
            >

            <p>
                ရေးးးး❤️
                <br><br>
                အချိန်လေးကိုစောင့်နေခဲ့တာ
                <br>
                Pokiလေးကိုအရမ်းချစ်တယ်နော်။ 🌹💞🫶🏻
            </p>

        </div>

    </div>


    <script>

        const correctButton =
            document.getElementById("correctButton");

        const wrongButtons =
            document.querySelectorAll(".wrong");

        const displayEmoji =
            document.getElementById("displayEmoji");

        const displayText =
            document.getElementById("displayText");

        const message =
            document.getElementById("message");

        const counter =
            document.getElementById("counter");

        const success =
            document.getElementById("success");

        const myPhoto =
            document.getElementById("myPhoto");


        let wrongCount = 0;


        const stages = [

            {
                emoji: "🌷",
                text: "အဲဒါတော့ မဟုတ်သေးဘူးနော် 😏",
                message: "ဒီတစ်ခါတော့ မှန်အောင်ရွေးနော်"
            },

            {
                emoji: "🌹",
                text: "မှားနေပြီ 👀",
                message: "သေချာစဉ်းစားပြီးမှ ထပ်ရွေးနော်… 😏"
            },

            {
                emoji: "💐",
                text: "တကယ်ပဲလား… 🥺!",
                message: "အလျင်မလိုဘဲ သေချာလေး စဉ်းစားနော်… 🥺"
            },

            {
                emoji: "💕",
                text: "အခုတော့ ပိုရှင်းလာပြီနော် ❤️",
                message: "ပန်းရောင်ခလုတ်လေးကို နှိပ်ကြည့်ပါ..."
            },

            {
                emoji: "💓",
                text: "ဒီလောက်ကြီးတာတောင် မမြင်သေးဘူးလား 😂",
                message: "အဖြေက ဒီမှာပါ ❤️"
            },

            {
                emoji: "💖",
                text: "မမြင်ချင်ယောင်ဆောင်နေတာလား 😭",
                message: "ဒီခလုတ်လေးကို နှိပ်ပေးပါနော် ❤️"
            }

        ];


        wrongButtons.forEach(function(button) {

            button.addEventListener("click", function() {

                wrongCount++;

                if (wrongCount > stages.length) {
                    wrongCount = stages.length;
                }


                /*
                =========================================
                MOVE CORRECT BUTTON TOWARD CENTER
                =========================================
                */

                const scale =
                    1 + (wrongCount * 0.22);

                correctButton.style.transform =
                    "translateY(" +
                    (-wrongCount * 8) +
                    "px) scale(" +
                    scale +
                    ")";


                /*
                =========================================
                MAKE BUTTON BIGGER
                =========================================
                */

                correctButton.style.paddingLeft =
                    (16 + wrongCount * 7) + "px";

                correctButton.style.paddingRight =
                    (16 + wrongCount * 7) + "px";


                correctButton.style.paddingTop =
                    (10 + wrongCount * 3) + "px";

                correctButton.style.paddingBottom =
                    (10 + wrongCount * 3) + "px";


                /*
                =========================================
                CHANGE DISPLAY
                =========================================
                */

                displayEmoji.textContent =
                    stages[wrongCount - 1].emoji;

                displayText.textContent =
                    stages[wrongCount - 1].text;

                message.textContent =
                    stages[wrongCount - 1].message;


                counter.textContent =
                    "Wrong choices: " + wrongCount;


                /*
                =========================================
                POP ANIMATION
                =========================================
                */

                displayEmoji.classList.remove("pop");

                void displayEmoji.offsetWidth;

                displayEmoji.classList.add("pop");


                /*
                =========================================
                GLOW
                =========================================
                */

                correctButton.style.boxShadow =
                    "0 0 35px rgba(255, 79, 129, 0.9)";


                createHeart();

            });

        });


        /*
        ============================================
        CORRECT BUTTON
        ============================================
        */

        correctButton.addEventListener("click", function() {

            wrongButtons.forEach(function(button) {
                button.disabled = true;
            });

            correctButton.disabled = true;

            success.classList.add("show");

            myPhoto.style.display = "block";


            for (let i = 0; i < 30; i++) {

                setTimeout(function() {
                    createHeart();
                }, i * 100);

            }

        });


        /*
        ============================================
        FLOATING HEART
        ============================================
        */

        function createHeart() {

            const heart =
                document.createElement("div");

            heart.className = "heart";

            const hearts = [
                "❤️",
                "💕",
                "💖",
                "💗",
                "💓",
                "💘"
            ];

            heart.textContent =
                hearts[
                    Math.floor(
                        Math.random() * hearts.length
                    )
                ];


            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.bottom =
                "-30px";

            heart.style.fontSize =
                (20 + Math.random() * 25) + "px";

            heart.style.animationDuration =
                (3 + Math.random() * 3) + "s";


            document.body.appendChild(heart);


            setTimeout(function() {
                heart.remove();
            }, 6000);

        }

    </script>

</body>
</html>
